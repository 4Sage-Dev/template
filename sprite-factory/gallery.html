<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Asset Factory - 4SAGE</title>
    <style>
      :root {
        --paper: #F4F1EA;
        --graphite: #333333;
        --bg: #1a1a1a;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg);
        color: #eee;
        margin: 0;
        display: flex;
        height: 100vh;
        overflow: hidden;
      }
      #asset-list {
        width: 450px;
        background: #252525;
        border-right: 2px solid var(--graphite);
        overflow-y: auto;
        padding: 1rem;
        height: 100%;
      }
      .asset-item {
        background: #333;
        margin-bottom: 1.5rem;
        padding: 12px;
        border-radius: 4px;
        border: 1px solid #444;
      }
      .asset-name {
        display: block;
        font-weight: bold;
        color: #aaa;
        margin-bottom: 8px;
        text-transform: uppercase;
        font-size: 0.75rem;
      }
      .preview-row {
        display: flex;
        gap: 15px;
        align-items: center;
        background: var(--paper);
        padding: 10px;
        border-radius: 2px;
      }
      .sheet-view img {
        image-rendering: pixelated;
        max-width: 180px;
        height: auto;
        display: block;
        border: 1px solid #ccc;
      }
      .anim-view {
        width: 48px;
        height: 48px;
        overflow: hidden;
        position: relative;
        border: 1px dashed #999;
        background: rgba(0,0,0,0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
      }
      .anim-sprite {
        image-rendering: pixelated;
        position: absolute;
        top: 50%;
        left: 0;
        transform: translateY(-50%);
      }

      #simulation-view {
        flex: 1;
        display: flex;
        flex-direction: column;
        padding: 1rem;
      }
      #preview-container {
        flex: 1;
        background: #FFFFFF; /* White Background as requested */
        border: 2px solid var(--graphite);
        border-radius: 4px;
        overflow: hidden;
      }
      h1 { font-size: 1.1rem; margin: 0 0 1rem 0; border-bottom: 1px solid #444; padding-bottom: 0.5rem; }
      
      .play-3 { animation: anim-3 0.4s steps(3) infinite; }
      @keyframes anim-3 { from { transform: translate(0, -50%); } to { transform: translate(-100%, -50%); } }
    </style>
  </head>
  <body>
    <div id="asset-list">
      <h1>Distributed Assets</h1>
      <div id="items-container">
        <!-- Asset Entry Example -->
        <div class="asset-item">
          <span class="asset-name">example_box</span>
          <div class="preview-row">
            <div class="sheet-view"><img src="/assets/example/sprite.png" /></div>
            <div class="anim-view">
              <div style="width:32px;height:32px;overflow:hidden;position:relative;">
                <img src="/assets/example/sprite.png" class="anim-sprite play-3" style="width:96px;height:32px;" />
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="simulation-view">
      <h1>Simulation Playground</h1>
      <div id="preview-container"></div>
    </div>

    <script type="module" src="/src/preview.ts"></script>
  </body>
</html>
